<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Lojista - Pedidos - Fogo & Brasa</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-fire-flame-curved" style="color: var(--primary);"></i> FOGO & <span>BRASA</span>
        </div>
      <nav>
    <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="cardapio.html">Cardápio</a></li>
        <li><a href="sobre.html">Sobre Nós</a></li>
        <li><a href="cliente.html">Criar Conta</a></li>
        <li><a href="admin-produtos.html">Painel Lojista</a></li>
    </ul>
</nav>
    </header>

    <!-- LISTA DE PEDIDOS -->
    <div style="max-width: 900px; margin: 120px auto 50px auto; padding: 0 5%;">
        <h2 style="font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 0.5rem; text-align: center; color: var(--text-main);">Pedidos Recebidos</h2>
        <p style="text-align: center; margin-bottom: 0.5rem; font-size: 0.9rem;">
            <a href="admin-produtos.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">&larr; Cadastrar produtos</a>
        </p>
        <p id="resumo" style="color: var(--text-muted); text-align: center; margin-bottom: 2rem; font-size: 0.9rem;">Carregando pedidos...</p>

        <div id="listaPedidos" style="display: flex; flex-direction: column; gap: 1.2rem;"></div>

        <div style="display: flex; justify-content: center; align-items: center; gap: 1rem; margin-top: 2rem;">
            <button id="btnAnterior" type="button" style="background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.6rem 1.2rem; border-radius: 10px; cursor: pointer;">Anterior</button>
            <button id="btnAtualizar" type="button" style="background: var(--primary); color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 10px; font-weight: 600; cursor: pointer;">Atualizar</button>
            <button id="btnProxima" type="button" style="background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.6rem 1.2rem; border-radius: 10px; cursor: pointer;">Próxima</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';
        const TOKEN_KEY = 'tokenJWT';   // mesma chave que o cliente.html usa ao fazer login
        const TAMANHO_PAGINA = 20;

        let paginaAtual = 0;
        let totalPaginas = 1;

        // Evita que texto digitado por clientes (nome, e-mail...) seja interpretado como HTML
        function esc(valor) {
            return String(valor ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function moeda(valor) {
            return Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        // Agrupa produtos repetidos: [Filé, Filé, Maminha] -> Filé x2, Maminha x1
        function agruparProdutos(produtos) {
            const mapa = new Map();
            (produtos || []).forEach(p => {
                const chave = p.id ?? p.nome;
                if (mapa.has(chave)) {
                    mapa.get(chave).quantidade++;
                } else {
                    mapa.set(chave, { nome: p.nome, preco: p.preco, quantidade: 1 });
                }
            });
            return [...mapa.values()];
        }

        function montarCliente(cliente) {
            const c = cliente || {};
            const linhas = [c.nome, c.email, c.telefone].filter(Boolean);
            if (linhas.length === 0) {
                return `<span style="color: var(--text-muted);">Cliente #${esc(c.id ?? '?')}</span>`;
            }
            return linhas.map((l, i) =>
                i === 0 ? `<strong>${esc(l)}</strong>` : `<span style="color: var(--text-muted);">${esc(l)}</span>`
            ).join('<br>');
        }

        function montarCard(pedido) {
            const itens = agruparProdutos(pedido.produtos).map(i => `
                <div style="display:flex; justify-content:space-between; padding: 0.35rem 0; border-bottom: 1px solid var(--border-color); font-size: 0.9rem;">
                    <span>${i.quantidade}x ${esc(i.nome)}</span>
                    <span style="color: var(--text-muted);">${moeda(i.preco * i.quantidade)}</span>
                </div>
            `).join('');

            return `
                <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 1.5rem;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1rem;">
                        <span style="font-weight: 700; color: var(--primary); font-size: 1.1rem;">Pedido #${esc(pedido.id)}</span>
                        <span style="color: var(--text-muted); font-size: 0.85rem;">Restaurante #${esc(pedido.restauranteId)}</span>
                    </div>
                    <div style="margin-bottom: 1rem; line-height: 1.6;">${montarCliente(pedido.cliente)}</div>
                    <div>${itens}</div>
                    <div style="display:flex; justify-content:space-between; margin-top: 1rem; font-weight: 700;">
                        <span>Total</span>
                        <span style="color: var(--primary);">${moeda(pedido.valorTotal)}</span>
                    </div>
                </div>
            `;
        }

        async function carregarPedidos(pagina = 0) {
            const lista = document.getElementById('listaPedidos');
            const resumo = document.getElementById('resumo');
            const token = localStorage.getItem(TOKEN_KEY);

            if (!token) {
                alert('Acesso restrito! Faça login como administrador.');
                window.location.href = 'cliente.html';
                return;
            }

            try {
                // sort=id,desc mostra os pedidos mais recentes primeiro
                const res = await fetch(`${API_URL}/pedido?page=${pagina}&size=${TAMANHO_PAGINA}&sort=id,desc`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (res.status === 401 || res.status === 403) {
                    resumo.textContent = 'Acesso restrito ao administrador. Faça login com a conta de administrador.';
                    lista.innerHTML = '';
                    return;
                }
                if (!res.ok) {
                    const detalhe = await res.text();
                    console.error('Erro da API:', res.status, detalhe);
                    resumo.textContent = 'Erro ' + res.status + ' ao carregar os pedidos.';
                    return;
                }

                const dados = await res.json();
                const pedidos = Array.isArray(dados) ? dados : (dados.content || []);

                paginaAtual = dados.number ?? pagina;
                totalPaginas = dados.totalPages ?? 1;
                const totalPedidos = dados.totalElements ?? pedidos.length;

                if (pedidos.length === 0) {
                    resumo.textContent = 'Nenhum pedido realizado ainda.';
                    lista.innerHTML = '';
                } else {
                    resumo.textContent = `${totalPedidos} pedido(s) • Página ${paginaAtual + 1} de ${Math.max(totalPaginas, 1)}`;
                    lista.innerHTML = pedidos.map(montarCard).join('');
                }

                document.getElementById('btnAnterior').disabled = paginaAtual <= 0;
                document.getElementById('btnProxima').disabled = paginaAtual + 1 >= totalPaginas;
            } catch (e) {
                console.error(e);
                resumo.textContent = 'Erro de conexão com o servidor Spring Boot.';
            }
        }

        document.getElementById('btnAnterior').addEventListener('click', () => carregarPedidos(paginaAtual - 1));
        document.getElementById('btnProxima').addEventListener('click', () => carregarPedidos(paginaAtual + 1));
        document.getElementById('btnAtualizar').addEventListener('click', () => carregarPedidos(paginaAtual));

        carregarPedidos(0);
    </script>
</body>
</html>
