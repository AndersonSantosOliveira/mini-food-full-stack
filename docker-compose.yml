services:
  mysql:
    image: mysql:8
    container_name: meu-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: meubanco
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Arquivos .sql desta pasta são importados automaticamente na PRIMEIRA subida (banco vazio)
      - ./db-init:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ./minifoodadsuema
    container_name: minifood-api
    restart: always
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/meubanco?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      JWT_SECRET: "cDWvZGM7eCU5V0RwXSS7CoSF+BuupOc7No+3wZ8qggf889LwnS7LuSB7po7F+PJy"
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  frontend:
    image: nginx:alpine
    container_name: minifood-front
    restart: always
    volumes:
      - ./frontend-html:/usr/share/nginx/html:ro
    ports:
      - "5500:80"
    depends_on:
      - backend

volumes:
  mysql_data: